<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Degla docking concept</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#151918;color:#e7eadf;font-family:Arial,sans-serif}#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#scene{position:absolute;inset:0}canvas{width:100%;height:100%;display:block}.top{position:absolute;top:24px;left:26px;right:26px;display:flex;justify-content:space-between;gap:20px;pointer-events:none}.label{font:11px monospace;letter-spacing:1.4px;color:#c4ccbd}.label span{display:block;font:12px Arial,sans-serif;letter-spacing:0;color:#8e9a85;margin-top:8px}.badge{font:10px monospace;letter-spacing:.8px;border:1px solid #8f9b6d66;border-radius:3px;padding:7px 9px;height:fit-content;background:#151a14b3;color:#cfdcbd}.bottom{position:absolute;bottom:0;left:0;right:0;padding:22px 26px 18px;background:linear-gradient(transparent,#101512ee 40%)}.status-line{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}#phase{font-size:19px;font-weight:400;letter-spacing:-.3px}.controls{display:flex;gap:8px}.controls button{color:#d8e3cd;border:1px solid #acbb9655;background:#1a2119bb;padding:8px 12px;border-radius:4px;cursor:pointer;font-size:12px}.controls button:hover{background:#34422d}.controls button:focus-visible,input:focus-visible{outline:2px solid #c4eaa9;outline-offset:4px}#scrub{width:100%;accent-color:#c6dfab;display:block;cursor:pointer;height:14px;margin:0}.steps{display:flex;justify-content:space-between;font:9px monospace;letter-spacing:1px;color:#73806a;margin-top:10px}.steps .active{color:#d9ebc9}.hint{position:absolute;right:26px;top:65px;font:10px monospace;color:#8c9981}.fallback{position:absolute;bottom:140px;left:26px;right:26px;font-size:13px;color:#c8d1bd}[hidden]{display:none!important}@media(max-width:650px){.top{top:17px;left:17px;right:17px}.label{font-size:9px}.label span{font-size:10px;max-width:150px;line-height:1.4}.badge{font-size:8px}.bottom{padding:20px 17px 16px}#phase{font-size:15px}.controls button{padding:7px 9px;font-size:11px}.steps{font-size:8px;letter-spacing:0}.hint{display:none}}</style></head><body><img id="poster" src="../assets/dock-cgi.png" alt="CGI concept of Degla’s white VTOL above an expanded yellow-roof docking hangar"><div id="scene" role="img" aria-label="Animated Degla VTOL taking off from and landing in its opening hangar"></div><div class="top"><div class="label">DEGLA / AUTONOMOUS DOCK<span>Built around the aircraft you already own.</span></div><div class="badge">DOCKING CONCEPT · Q1 2027</div></div><div class="hint">DRAG TO EXPLORE</div><p class="fallback" id="fallback" hidden>Interactive 3D requires WebGL. Docking concept shown above.</p><div class="bottom"><div class="status-line"><span id="phase" role="status">Ready for the next mission.</span><div class="controls"><button id="play" aria-label="Pause docking animation">Ⅱ Pause</button><button id="replay" aria-label="Replay docking sequence">↻ Replay</button></div></div><input id="scrub" type="range" min="0" max="34" step="0.01" value="0" aria-label="Docking animation timeline"><div class="steps"><span data-step="0" class="active">01 OPEN</span><span data-step="1">02 TAKE OFF</span><span data-step="2">03 RETURN</span><span data-step="3">04 LAND</span><span data-step="4">05 SECURE</span></div></div><script src="../swarm/vendor/three.min.js"></script><script src="../swarm/vendor/OrbitControls.js"></script><script src="model.js"></script><script src="scene.js"></script></body></html>
